name: Shared library quality
on:
  workflow_call:
    inputs:
      code_ref:
        type: string
        required: true
      full:
        type: boolean
        default: true
      quality_image:
        description: Optional prebuilt native multi-architecture quality image.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  independent:
    name: Platform-independent checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}
          path: production
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced-workflows
          path: workflow-tools
      - name: Build source-owned Debian 13 quality image
        if: inputs.quality_image == ''
        run: docker build --pull -t shared-quality:local -f production/containers/quality.Dockerfile production/containers
      - name: Check formatting, lint, analysis, and pull-request documentation once
        env:
          FULL: ${{ inputs.full }}
          QUALITY_IMAGE: ${{ inputs.quality_image || 'shared-quality:local' }}
          RPTADV_CONTAINER_PULL: ${{ inputs.quality_image == '' && '0' || '1' }}
        run: |
          if test "$FULL" = true; then
            sh workflow-tools/tools/run-in-quality-container.sh "$QUALITY_IMAGE" "$GITHUB_WORKSPACE/production" make -j3 quality
          else
            sh workflow-tools/tools/run-in-quality-container.sh "$QUALITY_IMAGE" "$GITHUB_WORKSPACE/production" make -j2 lint static-analysis
          fi
  platforms:
    if: inputs.full
    needs: independent
    name: Debian 13 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}
          path: production
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rpt_advanced-workflows
          path: workflow-tools
      - name: Build source-owned native quality image
        if: inputs.quality_image == ''
        run: docker build --pull -t shared-quality:local -f production/containers/quality.Dockerfile production/containers
      - name: Build, test, package, and verify staged installation
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          QUALITY_IMAGE: ${{ inputs.quality_image || 'shared-quality:local' }}
          RPTADV_CONTAINER_PULL: ${{ inputs.quality_image == '' && '0' || '1' }}
        run: |
          sh workflow-tools/tools/run-in-quality-container.sh "$QUALITY_IMAGE" "$GITHUB_WORKSPACE/production" sh -c \
            'test "$(dpkg --print-architecture)" = "$1" && make platform-verify QUALITY_IMAGE="$2"' sh "$EXPECTED_ARCH" "$QUALITY_IMAGE"
      - name: Require full production line and branch coverage
        if: matrix.arch == 'amd64'
        env:
          QUALITY_IMAGE: ${{ inputs.quality_image || 'shared-quality:local' }}
          RPTADV_CONTAINER_PULL: ${{ inputs.quality_image == '' && '0' || '1' }}
        run: sh workflow-tools/tools/run-in-quality-container.sh "$QUALITY_IMAGE" "$GITHUB_WORKSPACE/production" make coverage
      - name: Upload coverage evidence
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-debian13-amd64
          path: production/build/coverage
          if-no-files-found: warn
  required:
    name: Required quality gate
    if: always() && inputs.full
    needs: [independent, platforms]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          INDEPENDENT: ${{ needs.independent.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: test "$INDEPENDENT" = success && test "$PLATFORMS" = success
