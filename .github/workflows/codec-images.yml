name: Codec quality images
on:
  workflow_dispatch:
  push:
    branches: [main, ci/codec-provider-image]
    paths: [containers/codecs.Dockerfile, .github/workflows/codec-images.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: codec-quality-images
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/cpeter1207/rptadv-codecs-quality-debian13
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/codecs.Dockerfile
          pull: true
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
  manifest:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish verified native image pair
        env:
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" \
            "$IMAGE:$RUN_TAG-amd64" "$IMAGE:$RUN_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
