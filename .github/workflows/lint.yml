name: Workflow syntax
on: [push, pull_request]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8 -color
      - name: Validate candidate dependency setup
        run: |
          shellcheck -x actions/install-candidate-dependencies/build.sh
          python3 -m unittest discover -s tests
